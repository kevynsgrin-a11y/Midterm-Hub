  notes: "General election uses ranked-choice voting among top-four primary finishers. A ballot measure to repeal the open primary and ranked-choice general elections is also on the Nov 3 ballot, but the Alaska Constitution makes an initiated law effective ninety days after certification, so ranked-choice voting applies on Nov 3. Registration closed Sunday, Oct 4, 2026. In-person absentee (early) voting opens Oct 19 and runs through Election Day, Nov 3, at Division of Elections locations with site-specific hours. A by-mail absentee ballot application must be received by the Division by Oct 24; online-delivery and fax ballot requests must be received by 5 p.m. Alaska time on Nov 2. A mailed ballot must be postmarked on or before Nov 3 and, if mailed from within the U.S., received by close of business on Nov 13; a ballot mailed from overseas must also be postmarked by Nov 3 and received by close of business on Nov 18. A ballot can also be handed in at a voting location by 8 p.m. on Nov 3, and a faxed ballot must be received by 8 p.m. Alaska time on Nov 3."

